[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-sectional-ml"
version = "1.0.0"
description = "Feature construction, rolling model training, and portfolio evaluation for cross-sectional return prediction."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "torch>=2.4",
  "lightgbm>=4.5",
  "xgboost>=2.1",
]

[project.optional-dependencies]
mamba = ["mamba-ssm>=2.2"]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cross_sectional_ml = ["resources/*.csv", "resources/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"
